<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Демо — Spaces Float Player</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:#f3f3f3;color:#111}
  main{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:22px}
  .player_item{padding:12px;margin:8px 0;background:#fff;border-radius:10px;border:1px solid #ddd}
  nav a{display:inline-block;margin:4px 8px 4px 0;padding:10px 14px;background:#111;color:#fff;border-radius:10px;text-decoration:none}
  .fill{height:900px;background:repeating-linear-gradient(#fff 0 40px,#eee 40px 80px);border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1 id="h">Демо-страница</h1>
  <p>Имитация страницы Spaces: треки в блоках <code>.player_item[data-src]</code>. Запустите трек, перейдите по ссылкам ниже — музыка не должна прерываться.</p>
  <nav>
    <a href="demo.html">Страница 1</a>
    <a href="demo.html?p=2">Страница 2</a>
    <a href="demo.html?p=3">Без треков</a>
    <a href="demo.html?p=4">8 треков</a>
  </nav>
  <div id="tracks"></div>
  <div class="fill"></div>
</main>
<script>
(function () {
  function tone(freq, secs) {
    var sr = 8000, n = sr * secs, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), i;
    function s(o, t) { for (var k = 0; k < t.length; k++) v.setUint8(o + k, t.charCodeAt(k)); }
    s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, n * 2, true);
    for (i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / sr) * 6000, true);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  }
  var p = new URLSearchParams(location.search).get('p');
  var sets = { null: [['Тон 220 Гц', 220], ['Тон 330 Гц', 330], ['Тон 440 Гц', 440]], '2': [['Другой тон 262', 262], ['Другой тон 392', 392]], '3': [], '4': [['Тон 200',200],['Тон 250',250],['Тон 300',300],['Тон 350',350],['Тон 400',400],['Тон 450',450],['Тон 500',500],['Тон 550',550]] };
  var list = sets[p] || sets['null'];
  var box = document.getElementById('tracks');
  document.getElementById('h').textContent = 'Демо-страница ' + (p || '1');
  list.forEach(function (t, i) {
    var d = document.createElement('div');
    d.className = 'player_item';
    d.dataset.src = tone(t[1], 30);
    d.dataset.nid = 'demo-' + (p || '1') + '-' + i;
    d.dataset.title = t[0];
    d.dataset.artist = 'Генератор';
    d.dataset.durationValue = 30;
    d.textContent = t[0];
    box.appendChild(d);
  });
})();
</script>
<script src="float-player.js"></script>
</body>
</html>
